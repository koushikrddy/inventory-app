<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Inventory App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .card h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .card .subtitle {
            color: #888;
            margin-bottom: 24px;
            font-size: 14px;
        }
        #qrcode {
            display: inline-block;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed #dee2e6;
        }
        #qrcode img {
            border-radius: 4px;
        }
        .url {
            margin-top: 20px;
            padding: 10px 16px;
            background: #f1f3f5;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #495057;
            word-break: break-all;
        }
        .note {
            margin-top: 16px;
            font-size: 12px;
            color: #adb5bd;
        }
        .ip-info {
            margin-top: 12px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            font-size: 13px;
            color: #2e7d32;
        }
        .ip-info strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📦 Smart Inventory</h1>
        <p class="subtitle">Scan to open the app</p>
        <div id="qrcode"></div>
        <div class="url" id="urlDisplay"></div>
        <div class="ip-info" id="ipInfo" style="display:none;">
            <strong>📱 Scan from your phone using:</strong>
            <span id="networkUrl"></span>
        </div>
        <p class="note">Make sure your phone is on the same Wi-Fi network</p>
    </div>

    <script>
        // Detect the best URL to use
        // For same-device: use localhost
        // For phone scanning: use the machine's local IP
        function getURLs() {
            const urls = {
                localhost: 'http://localhost:5173',
                network: null
            };

            // Try to detect local IP from WebRTC
            try {
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (event) => {
                    if (!event || !event.candidate || !event.candidate.candidate) return;
                    const ipMatch = event.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                    if (ipMatch) {
                        const ip = ipMatch[0];
                        if (!ip.startsWith('127.') && !ip.startsWith('0.')) {
                            urls.network = `http://${ip}:5173`;
                            showQR(urls);
                            pc.close();
                        }
                    }
                };
            } catch(e) {}

            // Fallback: show localhost QR immediately
            showQR(urls);

            // If WebRTC doesn't find IP in 2 seconds, just show localhost
            setTimeout(() => {
                if (!urls.network) showQR(urls);
            }, 2000);
        }

        function showQR(urls) {
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';

            // Use localhost by default (works when opening this HTML on the same machine)
            const displayUrl = urls.localhost;
            document.getElementById('urlDisplay').textContent = displayUrl;

            new QRCode(qrDiv, {
                text: displayUrl,
                width: 200,
                height: 200,
                colorDark: "#333333",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Show network URL for phone scanning
            if (urls.network) {
                document.getElementById('ipInfo').style.display = 'block';
                document.getElementById('networkUrl').textContent = urls.network;

                // Generate a second QR for network URL
                const networkQR = document.createElement('div');
                networkQR.style.marginTop = '16px';
                networkQR.style.paddingTop = '16px';
                networkQR.style.borderTop = '1px solid #dee2e6';
                const networkLabel = document.createElement('p');
                networkLabel.style.cssText = 'font-size:12px; color:#888; margin-bottom:8px;';
                networkLabel.textContent = '📱 Phone QR:';
                networkQR.appendChild(networkLabel);
                const networkQRDiv = document.createElement('div');
                networkQR.appendChild(networkQRDiv);
                document.querySelector('.card').insertBefore(networkQR, document.querySelector('.note'));

                new QRCode(networkQRDiv, {
                    text: urls.network,
                    width: 150,
                    height: 150,
                    colorDark: "#2e7d32",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        getURLs();
    </script>
</body>
</html>
